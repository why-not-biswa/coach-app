<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Be Kobe">
<meta name="theme-color" content="#f2f0eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Let's be Kobe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Shared texture: diagonal lines mark a missed module in the day pie (read by texture, not color alone). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="4" height="4" style="fill:var(--clay-soft)"/><rect width="1.6" height="4" style="fill:var(--clay)"/>
  </pattern>
</defs></svg>
<main id="view"></main>
<nav id="tabs" aria-label="Main">
  <button data-tab="today" data-icon="today">Today</button>
  <button data-tab="journal" data-icon="journal">Journal</button>
  <button data-tab="progress" data-icon="progress">Progress</button>
  <button data-tab="coach" data-icon="coach">Coach</button>
</nav>
<div id="sheet" hidden></div>
<div id="timer" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
